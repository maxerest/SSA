<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>3D Satellite Visualizer</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Datetime bar -->
<div id="datetimeBar">
    <span class="no-epoch">No epoch set — load a satellite CSV to begin</span>
</div>

<!-- Controls -->
<div id="controls">
    <div class="ctrl-group">
        <button id="playBtn">▶ Play</button>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
        <label>Time</label>
        <input type="range" id="tSlider" min="0" max="9" value="0" step="1" style="width:130px;"/>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
        <label>Speed</label>
        <input type="range" id="speedSlider" min="-6" max="6" value="0" step="1" style="width:80px;"/>
        <span id="speedLabel">1×</span>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
        <button id="trailToggle" class="active">Trails</button>
        <button id="coneToggle">Cones</button>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
        <div class="load-wrap">
            <button id="loadBtn">
                <span>⬆ Load</span>
                <span class="chevron">▾</span>
            </button>
            <div class="load-menu" id="loadMenu">
                <button class="load-menu-item" id="mi-sat">
                    <span class="item-icon">🛰</span>
                    <span class="item-label">Satellite positions</span>
                    <span class="item-ext">.csv</span>
                </button>
                <button class="load-menu-item" id="mi-gs">
                    <span class="item-icon">📡</span>
                    <span class="item-label">Ground stations</span>
                    <span class="item-ext">.csv</span>
                </button>
                <div class="load-menu-divider"></div>
                <button class="load-menu-item" id="mi-orbital">
                    <span class="item-icon">🪐</span>
                    <span class="item-label">Orbital parameters</span>
                    <span class="item-ext">.csv</span>
                </button>
                <button class="load-menu-item" id="mi-satcom">
                    <span class="item-icon">🔗</span>
                    <span class="item-label">Satcom links</span>
                    <span class="item-ext">.csv</span>
                </button>
                <button class="load-menu-item" id="mi-eo">
                    <span class="item-label">EO regions</span>
                    <span class="item-ext">.csv</span>
                </button>
            </div>
        </div>
        <button id="configure">⚙ Configure</button>
        <button id="propagate">⟳ Propagate</button>
        <button id="2d_view">Ground track</button>
    </div>

    <input type="file" id="csvFile"     accept=".csv" style="display:none;"/>
    <input type="file" id="gsFile"      accept=".csv" style="display:none;"/>
    <input type="file" id="orbitalFile" accept=".csv" style="display:none;"/>
    <input type="file" id="satcomFile"  accept=".csv" style="display:none;"/>
    <input type="file" id="eoFile"      accept=".csv" style="display:none;"/>
</div>

<!-- Status / stats -->
<div id="statusRow">
    <div id="status">Click on Configure to start</div>
    <div id="statsRow"></div>
</div>

<!-- Main 3-column layout -->
<div id="mainLayout">

    <!-- LEFT: satellite summary list -->
    <div id="leftPanel">
        <div id="leftPanelHeader">Fleet Overview</div>
        <div id="satList">
            <div style="padding:16px 12px;font-size:11px;color:var(--text-dim);font-style:italic;">No satellites loaded</div>
        </div>
    </div>

    <!-- CENTER: 3D canvas -->
    <div id="canvasWrap">
        <canvas id="glCanvas"></canvas>
        <div id="legend"></div>
    </div>

    <!-- RIGHT: satellite detail panel -->
    <div id="rightPanel">
        <div id="rightPanelHeader">
            <span id="rightPanelDot"></span>
            <span id="rightPanelTitle">Satellite Detail</span>
            <div id="rightPanelSatRow">
                <div id="rightPanelSatDot"></div>
                <span id="rightPanelSatName"></span>
            </div>
            <button id="rightPanelClose" title="Deselect">✕</button>
            <button id="maneuverBtn" class="btn-accent" style="display:none;">🚀 Maneuver</button>
        </div>
        <div id="rightPanelEmpty">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="10" stroke="#586069" stroke-width="1.5"/>
                <line x1="20" y1="4"  x2="20" y2="10" stroke="#586069" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="20" y1="30" x2="20" y2="36" stroke="#586069" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="4"  y1="20" x2="10" y2="20" stroke="#586069" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="30" y1="20" x2="36" y2="20" stroke="#586069" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="3" fill="#586069"/>
            </svg>
            <span>Click a satellite on the globe<br>or in the fleet list to inspect</span>
        </div>
        <div id="maneuverModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;">
            <div style="background:#0d1117;border:1px solid #2a3441;border-radius:10px;width:520px;max-width:92vw;padding:16px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <span id="maneuverModalTitle" style="font-weight:600;">Maneuver</span>
                    <button id="maneuverModalClose">✕</button>
                </div>

                <canvas id="maneuverCanvas" style="width:100%;height:260px;display:block;background:#07090f;border-radius:6px;"></canvas>

                <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">
                    <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:#9aa;">
                        Time from epoch — <span id="maneuverTimeLabel">T = 0s</span>
                        <input type="range" id="maneuverTimeSlider" min="0" max="0" value="0"/>
                    </label>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button type="button" id="jumpApogee">Apogee</button>
                        <button type="button" id="jumpPerigee">Perigee</button>
                        <button type="button" id="jumpAscNode">Asc. Node</button>
                        <button type="button" id="jumpDescNode">Desc. Node</button>
                    </div>
                    <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:#9aa;">
                        Duration (s)
                        <input type="number" id="maneuverDuration" value="60" min="0"/>
                    </label>

                    <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:#9aa;">
                        Direction
                        <select id="maneuverDirection">
                            <option value="" selected disabled>— Select direction —</option>
                            <option value="tangential+">Tangential — prograde</option>
                            <option value="tangential-">Tangential — retrograde</option>
                            <option value="radial+">Radial — outward</option>
                            <option value="radial-">Radial — inward</option>
                            <option value="normal+">Normal — +</option>
                            <option value="normal-">Normal — -</option>
                        </select>
                        <div id="directionError" style="display:none;color:#ff6b6b;font-size:10px;">Please select a direction before confirming.</div> value="normal-">Normal — -</option>
                    </label>

                    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
                        <button id="maneuverCancelBtn">Cancel</button>
                        <button id="maneuverConfirmBtn" class="btn-green">Confirm Maneuver</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="rightPanelContent"></div>
    </div>

</div>

<script src="three.min.js"></script>
<script>
    if (typeof THREE === 'undefined') {
        document.getElementById('status').textContent = 'ERROR: Three.js failed to load';
    } else {
        const testCanvas = document.createElement('canvas');
        const gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
        if (!gl) document.getElementById('status').textContent = 'ERROR: WebGL not supported in this WebView';
    }
</script>
<script type="module" src="main.js"></script>

</body>
</html>
