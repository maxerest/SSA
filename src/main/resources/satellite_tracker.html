<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Satellite Ground Track Tracker</title>
    <link rel="stylesheet" href="web/styles.css" />
</head>
<body>

<!-- ── File explorer overlay (shown on startup) ───────────────── -->
<div id="explorerOverlay">
    <div id="explorerBox">
        <div id="explorerHeader">
            <span>Select satellite CSV</span>
            <button id="explorerSkip">Skip</button>
        </div>
        <input id="explorerSearch" type="text" placeholder="Filter files…" autocomplete="off" />
        <div id="explorerTree"></div>
        <div id="explorerFooter">
            <span id="explorerSelectedLabel">No file selected</span>
            <button id="explorerLoadBtn" disabled>Load</button>
        </div>
    </div>
</div>

<!-- ── Satellite info popup ────────────────────────────────────── -->
<div id="satInfoPopup" class="hidden">
    <div id="satInfoPopupHeader">
        <div id="satInfoPopupTitle">
            <span id="satInfoDot" style="width:9px;height:9px;border-radius:50%;display:inline-block;"></span>
            <span id="satInfoName">—</span>
        </div>
        <button id="satInfoPopupClose">✕</button>
    </div>
    <div id="satInfoPopupBody"></div>
</div>

<!-- ── Main UI ─────────────────────────────────────────────────── -->
<div id="datetimeBar">
    <span class="no-epoch">No epoch set — load an observations or SATCOM CSV to display simulation date</span>
</div>

<div id="controls">
    <label>Time</label>
    <input type="range" id="tSlider" min="0" max="9" value="0" step="1" style="flex:2;" />
    <div class="ctrl-sep"></div>
    <button id="playBtn">Play</button>
    <div class="ctrl-group">
        <label>Speed</label>
        <input type="range" id="speedSlider" min="-10" max="10" value="0" step="1" style="width:100px;flex:none;" />
        <span id="speedLabel">1x</span>
    </div>
    <div class="ctrl-sep"></div>
    <button id="uploadBtn">Load CSV</button>
    <button id="uploadGSBtn">Load GS CSV</button>
    <button id="uploadEOBtn">Load EO CSV</button>
    <button id="uploadObsBtn">Load Obs CSV</button>

    <!-- Hidden file inputs -->
    <input type="file" id="csvFile"  accept=".csv" style="display:none;" />
    <input type="file" id="gsFile"   accept=".csv" style="display:none;" />
    <input type="file" id="eoFile"   accept=".csv" style="display:none;" />
    <input type="file" id="obsFile"  accept=".csv" style="display:none;" />
</div>

<div id="status">Waiting for data…</div>
<div id="statsRow"></div>
<div id="mapDiv"></div>
<div id="legend"></div>

<!-- ── Third-party libraries ───────────────────────────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

<!-- ── Application scripts (load order: dependencies first) ────── -->
<script src="web/config.js"></script>   <!-- COLORS, EARTH_R                          -->
<script src="web/utils.js"></script>    <!-- xyz2ll, formatMs, getBest …              -->
<script src="web/state.js"></script>    <!-- sats, times, idx, obsEpoch …             -->
<script src="web/parsers.js"></script>  <!-- parseCSV, parseGSCSV, parseObsCSV …      -->
<script src="web/map.js"></script>      <!-- initMap, drawTracks, updateDots …        -->
<script src="web/popup.js"></script>    <!-- openSatInfoPopup, refreshSatInfoPopup … -->
<script src="web/stats.js"></script>    <!-- updateStats, buildLegend                 -->
<script src="web/explorer.js"></script> <!-- populateExplorer, renderExplorerTree …  -->
<script src="web/main.js"></script>     <!-- event listeners, Java bridge, initMap()  -->

</body>
</html>
