<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Satellite Ground Track Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #0a1220; color: #ccc; padding: 1rem; position: relative; min-height: 100vh; }
        #controls { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        label { font-size: 13px; color: #888; white-space: nowrap; }
        input[type=range] { flex: 1; min-width: 120px; cursor: pointer; }
        #tLabel { font-size: 13px; font-weight: 500; color: #fff; min-width: 70px; }
        #speedLabel { font-size: 13px; font-weight: 500; color: #fff; min-width: 40px; }
        button { font-size: 12px; padding: 4px 12px; background: transparent; color: #ccc; border: 0.5px solid #444; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1a2a3a; }
        #statsRow {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            max-height: calc(2 * (56px + 8px));
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
        }
        #statsRow::-webkit-scrollbar { width: 6px; }
        #statsRow::-webkit-scrollbar-track { background: transparent; }
        #statsRow::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 3px; }
        #statsRow::-webkit-scrollbar-thumb:hover { background: #3a5a6a; }
        .stat-card {
            background: #111e2e;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            min-width: 130px;
            height: 56px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.15s, opacity 0.15s;
            user-select: none;
            flex-shrink: 0;
        }
        .stat-card:hover { border-color: rgba(255,255,255,0.2); }
        .stat-card.hidden-sat { opacity: 0.35; border-color: rgba(255,255,255,0.08); }
        .stat-card .sat-name { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; font-weight: 500; color: #fff; }
        .stat-card .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .stat-card .row { color: #888; }
        .stat-card .val { color: #fff; }
        .stat-card .eye-icon { margin-left: auto; font-size: 11px; color: #555; }
        .stat-card:not(.hidden-sat) .eye-icon { color: #888; }
        #mapDiv { width: 100%; border-radius: 8px; overflow: hidden; border: 0.5px solid rgba(255,255,255,0.15); background: #0d1b2a; }
        #legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: #888; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        #status { font-size: 12px; color: #888; margin-bottom: 6px; }
        .ctrl-group { display: flex; align-items: center; gap: 6px; }
        .ctrl-sep { width: 1px; height: 20px; background: #333; margin: 0 4px; }

        #explorerOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 20, 0.88);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        #explorerOverlay.hidden { display: none; }
        #explorerBox {
            background: #0d1b2a; border: 0.5px solid #2a4a6a;
            border-radius: 10px; width: 520px; max-height: 480px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        #explorerHeader {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-bottom: 0.5px solid #1a3a5a;
            font-size: 13px; color: #aaa;
        }
        #explorerHeader span { color: #fff; font-weight: 500; font-size: 14px; }
        #explorerSkip {
            font-size: 11px; color: #556; background: transparent;
            border: 0.5px solid #334; padding: 3px 8px; border-radius: 4px; cursor: pointer;
        }
        #explorerSkip:hover { color: #aaa; border-color: #556; }
        #explorerSearch {
            margin: 10px 14px 6px; background: #0a1520; border: 0.5px solid #2a4a6a;
            border-radius: 6px; color: #ccc; font-size: 12px; font-family: monospace;
            padding: 6px 10px; outline: none; width: calc(100% - 28px);
        }
        #explorerSearch:focus { border-color: #4fc3f7; }
        #explorerTree {
            overflow-y: auto; flex: 1; padding: 6px 0;
        }
        #explorerTree::-webkit-scrollbar { width: 5px; }
        #explorerTree::-webkit-scrollbar-thumb { background: #1a3a5a; border-radius: 3px; }
        .ex-folder {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 16px; font-size: 12px; color: #7aa; cursor: pointer;
            user-select: none;
        }
        .ex-folder:hover { background: #112030; }
        .ex-folder .icon { font-size: 12px; color: #4fc3f7; width: 14px; text-align: center; }
        .ex-file {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 16px 5px 32px; font-size: 12px; color: #ccc; cursor: pointer;
            user-select: none; border-radius: 4px;
        }
        .ex-file:hover { background: #112a3a; color: #fff; }
        .ex-file.selected { background: #0e2a40; color: #4fc3f7; border-left: 2px solid #4fc3f7; }
        .ex-file .icon { font-size: 11px; color: #4fc3f7; width: 14px; text-align: center; }
        #explorerFooter {
            padding: 10px 14px; border-top: 0.5px solid #1a3a5a;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        #explorerSelectedLabel { font-size: 11px; color: #556; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #explorerLoadBtn {
            font-size: 12px; padding: 5px 18px; background: #1a4a7a;
            color: #7fc8f8; border: 0.5px solid #2a6aaa; border-radius: 6px; cursor: pointer;
        }
        #explorerLoadBtn:hover { background: #1e5a8a; }
        #explorerLoadBtn:disabled { opacity: 0.3; cursor: default; }
    </style>
</head>
<body>

<div id="explorerOverlay">
    <div id="explorerBox">
        <div id="explorerHeader">
            <span>Select satellite CSV</span>
            <button id="explorerSkip">Skip</button>
        </div>
        <input id="explorerSearch" type="text" placeholder="Filter files..." autocomplete="off" />
        <div id="explorerTree"></div>
        <div id="explorerFooter">
            <span id="explorerSelectedLabel">No file selected</span>
            <button id="explorerLoadBtn" disabled>Load</button>
        </div>
    </div>
</div>

<div id="controls">
    <label>Time</label>
    <input type="range" id="tSlider" min="0" max="9" value="0" step="1" style="flex:2;" />
    <span id="tLabel">00:00:00</span>
    <div class="ctrl-sep"></div>
    <button id="playBtn">Play</button>
    <div class="ctrl-group">
        <label>Speed</label>
        <input type="range" id="speedSlider" min="-10" max="10" value="0" step="1" style="width:100px;flex:none;" />
        <span id="speedLabel">1x</span>
    </div>
    <div class="ctrl-sep"></div>
    <button id="uploadBtn">Load CSV</button>
    <button id="uploadGSBtn">Load GS CSV</button>
    <button id="uploadEOBtn">Load EO CSV</button>
    <button id="uploadObsBtn">Load Obs CSV</button>
    <input type="file" id="csvFile"  accept=".csv" style="display:none;" />
    <input type="file" id="gsFile"   accept=".csv" style="display:none;" />
    <input type="file" id="eoFile"   accept=".csv" style="display:none;" />
    <input type="file" id="obsFile"  accept=".csv" style="display:none;" />
</div>

<div id="status">Waiting for data...</div>
<div id="statsRow"></div>
<div id="mapDiv"></div>
<div id="legend"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
    const COLORS = [
        '#4fc3f7','#81c784','#ffb74d','#f48fb1','#ce93d8','#80cbc4','#fff176','#ff8a65',
        '#e57373','#64b5f6','#aed581','#ffd54f','#4db6ac','#ba68c8','#ff8a65','#90a4ae',
        '#f06292','#4dd0e1','#dce775','#ffcc02','#26c6da','#ab47bc','#ef5350','#42a5f5',
        '#9ccc65','#ffa726','#26a69a','#7e57c2','#ec407a','#29b6f6','#d4e157','#ff7043',
        '#00bcd4','#8d6e63','#78909c','#66bb6a','#ffc107','#5c6bc0','#26c6da','#d81b60',
        '#00897b','#558b2f','#f57f17','#6a1b9a','#0277bd','#2e7d32','#e65100','#37474f',
        '#ad1457','#00695c'
    ];
    const EARTH_R = 6371000;

    function sliderToSpeed(v) { return Math.pow(10, v / 10); }

    function formatSecondsAsTime(secs, format) {
        var hr  = Math.floor(secs / 3600);
        var min = Math.floor((secs - (hr * 3600)) / 60);
        var sec = Math.floor(secs - (hr * 3600) - (min * 60));
        if (hr  < 10) { hr  = "0" + hr;  }
        if (min < 10) { min = "0" + min; }
        if (sec < 10) { sec = "0" + sec; }
        if (format != null) {
            var ft = format.replace('hh', hr);
            ft = ft.replace('h', hr*1+"");
            ft = ft.replace('mm', min);
            ft = ft.replace('m', min*1+"");
            ft = ft.replace('ss', sec);
            ft = ft.replace('s', sec*1+"");
            return ft;
        }
        return hr + ':' + min + ':' + sec;
    }

    let sats = {}, times = [], idx = 0, playing = false, timer = null;
    let groundStations = [];
    let EOzones = [];
    let observations = [];   // parsed observation windows
    let svg, projection, pathGen, W, H;
    let dotLayer, trackLayer, gsLayer, eoLayer, obsLayer;
    let speedMultiplier = 1.0;
    let hiddenSats = new Set();
    window.mapInitialized = false;

    // Reference epoch: the first time-step value is treated as t=0 offset
    // For satellite data t is in seconds; for observations we compute seconds from the same epoch.
    let obsEpoch = null;   // Unix ms of t=0 in the satellite timeline

    function xyz2ll(x, y, z) {
        const r = Math.sqrt(x*x + y*y + z*z);
        return [Math.atan2(y, x) * 180 / Math.PI, Math.asin(z / r) * 180 / Math.PI];
    }

    // ── Satellite CSV ────────────────────────────────────────────────
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const h = lines[0].split(',').map(s => s.trim());
        const iN=h.indexOf('name_sat'), iX=h.indexOf('x'), iY=h.indexOf('y'),
            iZ=h.indexOf('z'), iT=h.indexOf('t'), iF=h.indexOf('firing');
        const out = {}, ts = new Set();
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const name = c[iN]?.trim(), x = parseFloat(c[iX]), y = parseFloat(c[iY]),
                z = parseFloat(c[iZ]), t = parseFloat(c[iT]), firing = parseInt(c[iF]) || 0;
            if (!name || isNaN(x) || isNaN(t)) continue;
            if (!out[name]) out[name] = [];
            out[name].push({x, y, z, t, firing});
            ts.add(t);
        }
        return { sats: out, times: Array.from(ts).sort((a,b) => a - b) };
    }

    // ── Ground-station CSV ───────────────────────────────────────────
    function parseGSCSV(text) {
        const lines = text.trim().split('\n');
        const h = lines[0].split(',').map(s => s.trim());
        const iN=h.indexOf('name'), iLat=h.indexOf('lat'), iLon=h.indexOf('long'),
            iAlt=h.indexOf('alt'), iA=h.indexOf('activated');
        const out = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const name = c[iN]?.trim();
            const lat  = parseFloat(c[iLat]);
            const lon  = parseFloat(c[iLon]);
            const activated = parseInt(c[iA]) === 1;
            if (!name || isNaN(lat) || isNaN(lon)) continue;
            out.push({ name, lat, lon, activated });
        }
        return out;
    }

    // ── EO-area CSV ──────────────────────────────────────────────────
    function parseEOCSV(text) {
        const lines = text.trim().split('\n');
        const out = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const name = c[0]?.trim();
            const points = [];
            for (let j = 1; j + 2 <= c.length; j += 3) {
                const lat = parseFloat(c[j]);
                const lon = parseFloat(c[j+1]);
                if (!isNaN(lat) && !isNaN(lon)) {
                    // Coordinates_area_to_observe uses lon values > 180 (e.g. 270 = -90)
                    // normalise to [-180, 180]
                    const normLon = ((lon + 180) % 360) - 180;
                    points.push([normLon, lat]);
                }
            }
            if (name && points.length >= 3) {
                // Compute centroid for observation-line anchor
                const cx = points.reduce((s,p) => s + p[0], 0) / points.length;
                const cy = points.reduce((s,p) => s + p[1], 0) / points.length;
                out.push({ name, points, centroid: [cx, cy] });
            }
        }
        return out;
    }

    // ── Observations CSV ─────────────────────────────────────────────
    // Columns: zone_name, start_time, end_time, duration_s, name_sat_doing_observation
    // Timestamps are ISO-8601 strings like 2026-04-23T16:08:25.009285247521242112Z
    function parseObsCSV(text) {
        const lines = text.trim().split('\n');
        const h = lines[0].split(',').map(s => s.trim());
        const iZone  = h.indexOf('zone_name');
        const iStart = h.indexOf('start_time');
        const iEnd   = h.indexOf('end_time');
        const iSat   = h.indexOf('name_sat_doing_observation');
        if (iZone < 0 || iStart < 0 || iEnd < 0 || iSat < 0) {
            console.warn('Observations CSV: missing expected columns', h);
            return [];
        }
        const out = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const zone  = c[iZone]?.trim();
            const satName = c[iSat]?.trim();
            // Truncate sub-second precision to what Date.parse can handle (ms only)
            const startMs = isoToMs(c[iStart]?.trim());
            const endMs   = isoToMs(c[iEnd]?.trim());
            if (!zone || !satName || isNaN(startMs) || isNaN(endMs)) continue;
            out.push({ zone, satName, startMs, endMs });
        }
        return out;
    }

    // Parse an ISO-8601 string that may have nano/picosecond precision into Unix ms.
    // JavaScript's Date.parse only handles up to milliseconds, so we trim the fractional
    // part to 3 digits before parsing.
    function isoToMs(isoStr) {
        if (!isoStr) return NaN;
        // Replace the fractional seconds part (any length) with at most 3 digits
        const fixed = isoStr.replace(/(\.\d{1,3})\d*/, '$1');
        return Date.parse(fixed);
    }

    // ── Zone centroid lookup ─────────────────────────────────────────
    function getZoneCentroid(zoneName) {
        const z = EOzones.find(z => z.name === zoneName);
        return z ? z.centroid : null;
    }

    // ── Draw observation lines ───────────────────────────────────────
    // Called every frame; draws a light-yellow dashed line from the satellite
    // to the centroid of its observed zone for every active observation window.
    function drawObservationLines(currentUnixMs) {
        obsLayer.selectAll('*').remove();
        if (!observations.length || !EOzones.length) return;

        observations.forEach(obs => {
            if (currentUnixMs < obs.startMs || currentUnixMs > obs.endMs) return;
            if (hiddenSats.has(obs.satName)) return;
            if (!sats[obs.satName]) return;

            // Find current satellite position
            const satPts = sats[obs.satName];
            const t = times[idx];
            const best = getBest(satPts, t);
            const satLL = xyz2ll(best.x, best.y, best.z);
            const satPos = projection(satLL);
            if (!satPos) return;

            // Find zone centroid in projected space
            const centroid = getZoneCentroid(obs.zone);
            if (!centroid) return;
            const zonePos = projection(centroid);
            if (!zonePos) return;

            // Dashed light-yellow line
            obsLayer.append('line')
                .attr('x1', satPos[0]).attr('y1', satPos[1])
                .attr('x2', zonePos[0]).attr('y2', zonePos[1])
                .attr('stroke', '#ffffaa')
                .attr('stroke-width', 1.4)
                .attr('stroke-dasharray', '5,3')
                .attr('opacity', 0.75);

        });
    }

    // ── Convert current slider time to Unix ms ───────────────────────
    // obsEpoch is the Unix-ms timestamp that corresponds to t=0 in the satellite data.
    // It is set when observations are loaded (we use the earliest observation start as anchor
    // if the satellite data has not been loaded yet, or we derive it from a user-provided epoch).
    //
    // Strategy: when both satellite CSV and observations CSV are available, we assume the
    // satellite t values are seconds elapsed since obsEpoch.  obsEpoch is taken as the
    // Unix-ms of the very first ISO timestamp found in the observations file.
    function currentUnixMs() {
        if (obsEpoch === null || !times.length) return NaN;
        return obsEpoch + times[idx] * 1000;
    }

    // ── Map drawing helpers ──────────────────────────────────────────
    function drawGroundStations() {
        gsLayer.selectAll('*').remove();
        groundStations.forEach(gs => {
            const pos = projection([gs.lon, gs.lat]);
            if (!pos) return;
            const col = gs.activated ? '#4caf50' : '#f44336';
            const size = 7;
            const diamond = `M${pos[0]},${pos[1]-size} L${pos[0]+size},${pos[1]} L${pos[0]},${pos[1]+size} L${pos[0]-size},${pos[1]} Z`;
            gsLayer.append('path')
                .attr('d', diamond)
                .attr('fill', col)
                .attr('stroke', '#fff')
                .attr('stroke-width', 0.8)
                .attr('opacity', 0.9);
            gsLayer.append('text')
                .attr('x', pos[0] + 10).attr('y', pos[1] + 4)
                .attr('fill', col).attr('font-size', '10px').attr('font-family', 'monospace')
                .text(gs.name);
        });
    }

    function loadEOAreas() {
        eoLayer.selectAll('*').remove();
        EOzones.forEach(area => {
            const projected = area.points.map(p => projection(p)).filter(p => p !== null);
            if (projected.length < 3) return;
            const polyPath = 'M' + projected.map(p => p[0]+','+p[1]).join('L') + 'Z';
            eoLayer.append('path')
                .attr('d', polyPath)
                .attr('fill', '#29b6f6')
                .attr('fill-opacity', 0.15)
                .attr('stroke', '#29b6f6')
                .attr('stroke-width', 1.2)
                .attr('stroke-opacity', 0.7);
            const cx = projected.reduce((s, p) => s + p[0], 0) / projected.length;
            const cy = projected.reduce((s, p) => s + p[1], 0) / projected.length;
            eoLayer.append('text')
                .attr('x', cx).attr('y', cy)
                .attr('fill', '#29b6f6')
                .attr('font-size', '10px')
                .attr('font-family', 'monospace')
                .attr('text-anchor', 'middle')
                .text(area.name);
        });
        buildLegend(EOzones.length > 0);
    }

    function applyGSData(stations) {
        groundStations = stations;
        drawGroundStations();
        buildLegend(false);
    }
    function applyEOData(zones) {
        EOzones = zones;
        loadEOAreas();
    }

    function loadGSFromText(text) { applyGSData(parseGSCSV(text)); }
    function loadEOFromText(text) { applyEOData(parseEOCSV(text)); }
    // ── Apply observation data ────────────────────────────────────────
    function loadObsFromText(text) {
        const parsed = parseObsCSV(text);
        observations = parsed;
        // Derive obsEpoch as the minimum start timestamp in the observations.
        // This means t=0 in satellite data corresponds to the earliest observation start.
        // If the satellite data is already loaded and has a natural epoch you should adjust
        // obsEpoch here accordingly; for now we use the minimum start time.
        if (parsed.length > 0) {
            const minMs = Math.min(...parsed.map(o => o.startMs));
            obsEpoch = minMs - (times.length > 0 ? times[0] * 1000 : 0);
        }
        const status = document.getElementById('status');
        status.textContent = status.textContent.replace(/ \| \d+ obs.*/, '') +
            ' | ' + observations.length + ' observation window(s) loaded.';
        updateDots();
        buildLegend(EOzones.length > 0);
    }

    function getBest(pts, t) {
        let best = pts[0], bd = Infinity;
        pts.forEach(p => { const d = Math.abs(p.t - t); if (d < bd) { bd = d; best = p; } });
        return best;
    }

    function updateDots() {
        if (!times.length) return;
        const t = times[idx];
        document.getElementById('tLabel').textContent = formatSecondsAsTime(t);
        document.getElementById('tSlider').value = idx;
        dotLayer.selectAll('*').remove();

        Object.keys(sats).forEach((name, si) => {
            if (hiddenSats.has(name)) return;

            const col = COLORS[si % COLORS.length];
            const best = getBest(sats[name], t);
            const ll = xyz2ll(best.x, best.y, best.z);
            const pos = projection(ll);
            if (!pos) return;

            if (best.firing) {
                dotLayer.append('circle')
                    .attr('cx', pos[0]).attr('cy', pos[1]).attr('r', 11)
                    .attr('fill', 'none').attr('stroke', '#ffb74d').attr('stroke-width', 2);
            }
            dotLayer.append('circle')
                .attr('cx', pos[0]).attr('cy', pos[1]).attr('r', 6)
                .attr('fill', col).attr('stroke', '#fff').attr('stroke-width', 0.5);
            dotLayer.append('text')
                .attr('x', pos[0] + 9).attr('y', pos[1] + 4)
                .attr('fill', '#ffffff').attr('font-size', '11px').attr('font-family', 'monospace')
                .text(name);
            const alt = (Math.sqrt(best.x**2 + best.y**2 + best.z**2) - EARTH_R) / 1000;
            dotLayer.append('text')
                .attr('x', pos[0] + 9).attr('y', pos[1] + 15)
                .attr('fill', 'rgba(255,255,255,0.5)').attr('font-size', '10px').attr('font-family', 'monospace')
                .text(Math.round(alt) + ' km');
        });

        // Draw observation lines for the current moment
        drawObservationLines(currentUnixMs());
        updateStats(t);
    }

    function drawTracks() {
        trackLayer.selectAll('*').remove();
        Object.keys(sats).forEach((name, si) => {
            if (hiddenSats.has(name)) return;

            const col = COLORS[si % COLORS.length];
            const pts = sats[name];
            const chunks = [];
            let chunk = [pts[0]];
            for (let i = 1; i < pts.length; i++) {
                const prev = xyz2ll(pts[i-1].x, pts[i-1].y, pts[i-1].z);
                const curr = xyz2ll(pts[i].x, pts[i].y, pts[i].z);
                if (Math.abs(curr[0] - prev[0]) > 180) { chunks.push(chunk); chunk = []; }
                chunk.push(pts[i]);
            }
            chunks.push(chunk);
            const lineGen = d3.line()
                .x(d => { const p = projection(xyz2ll(d.x, d.y, d.z)); return p ? p[0] : null; })
                .y(d => { const p = projection(xyz2ll(d.x, d.y, d.z)); return p ? p[1] : null; })
                .defined(d => projection(xyz2ll(d.x, d.y, d.z)) !== null);
            chunks.forEach(ch => {
                trackLayer.append('path').datum(ch)
                    .attr('d', lineGen)
                    .attr('fill', 'none')
                    .attr('stroke', col)
                    .attr('stroke-width', 1.2)
                    .attr('opacity', 0.5);
            });
        });
    }

    function buildLegend(hasEO) {
        const leg = document.getElementById('legend');
        leg.innerHTML = '';
        Object.keys(sats).forEach((name, si) => {
            const col = COLORS[si % COLORS.length];
            const hidden = hiddenSats.has(name);
            leg.innerHTML += `<span class="legend-item" style="opacity:${hidden ? 0.35 : 1}">`
                + `<span class="legend-dot" style="background:${col};"></span>${name}</span>`;
        });
        if (groundStations.length > 0) {
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:10px;height:10px;background:#4caf50;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);"></span>GS active</span>`;
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:10px;height:10px;background:#f44336;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);"></span>GS inactive</span>`;
        }
        if (hasEO) {
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:10px;height:10px;background:#1a2a3a;opacity:0.5;border:1px solid #15b1f9;"></span>EO observation zone</span>`;
        }
        if (observations.length > 0) {
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:18px;height:2px;background:#ffffaa;opacity:0.8;border-top:2px dashed #ffffaa;margin-bottom:3px;"></span>Active observation</span>`;
        }
    }

    function updateStats(t) {
        const row = document.getElementById('statsRow');
        row.innerHTML = '';
        Object.keys(sats).forEach((name, si) => {
            const col = COLORS[si % COLORS.length];
            const best = getBest(sats[name], t);
            const ll = xyz2ll(best.x, best.y, best.z);
            const alt = (Math.sqrt(best.x**2 + best.y**2 + best.z**2) - EARTH_R) / 1000;
            const hidden = hiddenSats.has(name);
            const card = document.createElement('div');
            card.className = 'stat-card' + (hidden ? ' hidden-sat' : '');
            card.title = hidden ? 'Click to show ' + name : 'Click to hide ' + name;
            card.innerHTML = `
                <div class="sat-name">
                    <span class="dot" style="background:${col};"></span>
                    ${name}
                    <span class="eye-icon" style="margin-left:auto;font-size:10px;">${hidden ? 'show' : 'hide'}</span>
                </div>
                <div class="row">Lat <span class="val">${ll[1].toFixed(2)}°</span> &nbsp;Lon <span class="val">${ll[0].toFixed(2)}°</span></div>
                <div class="row">Alt <span class="val">${Math.round(alt)} km</span></div>`;
            card.addEventListener('click', () => {
                if (hiddenSats.has(name)) { hiddenSats.delete(name); } else { hiddenSats.add(name); }
                drawTracks();
                updateDots();
                buildLegend(EOzones.length > 0);
            });
            row.appendChild(card);
        });
    }

    function applyData(parsed) {
        sats = parsed.sats;
        times = parsed.times;
        idx = 0;
        hiddenSats.clear();
        // Re-compute obsEpoch when new satellite data is loaded
        if (observations.length > 0) {
            const minMs = Math.min(...observations.map(o => o.startMs));
            obsEpoch = minMs - times[0] * 1000;
        }
        const sl = document.getElementById('tSlider');
        sl.min = 0; sl.max = times.length - 1; sl.value = 0;
        document.getElementById('status').textContent =
            Object.keys(sats).length + ' satellite(s), ' + times.length + ' time steps loaded.' +
            (observations.length ? ' | ' + observations.length + ' observation window(s) loaded.' : '');
        buildLegend(EOzones.length > 0);
        drawTracks();
        updateDots();
    }

    function restartTimer() {
        if (!playing) return;
        clearInterval(timer);
        const interval = Math.max(16, Math.round(120 / speedMultiplier));
        const steps = speedMultiplier >= 1 ? Math.round(speedMultiplier) : 1;
        timer = setInterval(() => {
            idx = (idx + steps) % times.length;
            updateDots();
        }, interval);
    }

    function initMap() {
        const container = document.getElementById('mapDiv');
        W = container.clientWidth;
        H = Math.round(W * 0.45);

        svg = d3.select('#mapDiv').append('svg').attr('width', W).attr('height', H);
        projection = d3.geoEquirectangular().scale(W / 6.28).translate([W/2, H/2]);
        pathGen = d3.geoPath().projection(projection);

        svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#0d1b2a');

        const graticule = d3.geoGraticule()();
        svg.append('g').append('path').datum(graticule)
            .attr('d', pathGen)
            .attr('fill', 'none').attr('stroke', 'rgba(255,255,255,0.08)').attr('stroke-width', 0.5);

        const landLayer = svg.append('g');
        eoLayer    = svg.append('g');
        trackLayer = svg.append('g');
        gsLayer    = svg.append('g');
        obsLayer   = svg.append('g');   // observation lines — above GS, below dots
        dotLayer   = svg.append('g');

        d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
            landLayer.selectAll('path')
                .data(topojson.feature(world, world.objects.countries).features)
                .join('path')
                .attr('d', pathGen)
                .attr('fill', '#1a3a5c')
                .attr('stroke', 'rgba(255,255,255,0.15)')
                .attr('stroke-width', 0.4);
            window.mapInitialized = true;
        }).catch(() => {
            window.mapInitialized = true;
        });
    }

    function resetmap() {
        d3.select('#mapDiv').selectAll('*').remove();
        initMap();
    }

    // ── Event listeners ──────────────────────────────────────────────
    document.getElementById('tSlider').addEventListener('input', e => {
        idx = parseInt(e.target.value); updateDots();
    });
    document.getElementById('speedSlider').addEventListener('input', e => {
        const v = parseInt(e.target.value);
        speedMultiplier = sliderToSpeed(v);
        const label = speedMultiplier < 1 ? speedMultiplier.toFixed(1)+'x' : Math.round(speedMultiplier)+'x';
        document.getElementById('speedLabel').textContent = label;
        restartTimer();
    });
    document.getElementById('playBtn').addEventListener('click', () => {
        playing = !playing;
        document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
        if (playing) { restartTimer(); } else { clearInterval(timer); }
    });
    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('csvFile').click());
    document.getElementById('csvFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { applyData(parseCSV(ev.target.result)); };
        r.readAsText(f);
    });
    document.getElementById('uploadGSBtn').addEventListener('click', () => document.getElementById('gsFile').click());
    document.getElementById('gsFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { applyGSData(parseGSCSV(ev.target.result)); };
        r.readAsText(f);
    });
    document.getElementById('uploadEOBtn').addEventListener('click', () => document.getElementById('eoFile').click());
    document.getElementById('eoFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { loadEOFromText(ev.target.result); };
        r.readAsText(f);
    });
    document.getElementById('uploadObsBtn').addEventListener('click', () => document.getElementById('obsFile').click());
    document.getElementById('obsFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { loadObsFromText(ev.target.result); };
        r.readAsText(f);
    });

    window.addEventListener('resize', () => {
        const wait = setInterval(() => {
            if (!window.mapInitialized) return;
            clearInterval(wait);
            resetmap();
            drawTracks();
            loadEOAreas();
            drawGroundStations();
            updateDots();
        }, 50);
    });

    initMap();

    // ── Folder Explorer ──────────────────────────────────────────────
    let explorerSelected = null;
    let explorerData = [];

    window.populateExplorer = function(jsonStr) {
        explorerData = JSON.parse(jsonStr);
        renderTree('');
    };

    function renderTree(filter) {
        const tree = document.getElementById('explorerTree');
        tree.innerHTML = '';
        const q = filter.toLowerCase().trim();
        explorerData.forEach(folder => {
            const files = folder.files.filter(f =>
                !q || f.toLowerCase().includes(q) || folder.folder.toLowerCase().includes(q)
            );
            if (files.length === 0) return;
            const folderEl = document.createElement('div');
            folderEl.className = 'ex-folder';
            folderEl.innerHTML = `<span class="icon">&#9656;</span><span>${folder.folder}</span>`;
            tree.appendChild(folderEl);
            files.forEach(file => {
                const absPath = folder.path + '/' + file;
                const fileEl = document.createElement('div');
                fileEl.className = 'ex-file' + (explorerSelected && explorerSelected.absPath === absPath ? ' selected' : '');
                fileEl.innerHTML = `<span class="icon">&#9632;</span><span>${file}</span>`;
                fileEl.addEventListener('click', () => {
                    explorerSelected = { folder: folder.folder, file, absPath };
                    document.getElementById('explorerSelectedLabel').textContent = folder.folder + ' / ' + file;
                    document.getElementById('explorerLoadBtn').disabled = false;
                    tree.querySelectorAll('.ex-file').forEach(el => el.classList.remove('selected'));
                    fileEl.classList.add('selected');
                });
                tree.appendChild(fileEl);
            });
        });
        if (!tree.children.length) {
            tree.innerHTML = '<div style="padding:16px;color:#445;font-size:12px;">No files match</div>';
        }
    }

    document.getElementById('explorerSearch').addEventListener('input', e => renderTree(e.target.value));

    document.getElementById('explorerLoadBtn').addEventListener('click', () => {
        if (!explorerSelected) return;
        if (window.javaBridge) {
            window.javaBridge.loadSatCSV(explorerSelected.absPath);
        }
        document.getElementById('explorerOverlay').classList.add('hidden');
    });

    document.getElementById('explorerSkip').addEventListener('click', () => {
        document.getElementById('explorerOverlay').classList.add('hidden');
    });

    window.receiveCSVContent = function(content) {
        applyData(parseCSV(content));
    };

    // Java bridge hooks for observations & EO areas (call from Java side if needed)
    window.receiveObsCSVContent = function(content) { loadObsFromText(content); };
    window.receiveEOCSVContent  = function(content) { loadEOFromText(content); };
    window.receiveObsCSVContent  = function(content) { loadObsFromText(content); };

    setTimeout(() => {
        if (explorerData.length === 0) {
            document.getElementById('explorerTree').innerHTML =
                '<div style="padding:16px;color:#445;font-size:12px;">Waiting for Java bridge...<br>Use the Load CSV button instead.</div>';
        }
    }, 800);
</script>
</body>
</html>
