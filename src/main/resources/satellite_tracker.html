<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Satellite Ground Track Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #0a1220; color: #ccc; padding: 1rem; }
        #controls { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        label { font-size: 13px; color: #888; white-space: nowrap; }
        input[type=range] { flex: 1; min-width: 120px; cursor: pointer; }
        #tLabel { font-size: 13px; font-weight: 500; color: #fff; min-width: 70px; }
        #speedLabel { font-size: 13px; font-weight: 500; color: #fff; min-width: 40px; }
        button { font-size: 12px; padding: 4px 12px; background: transparent; color: #ccc; border: 0.5px solid #444; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1a2a3a; }
        #statsRow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .stat-card { background: #111e2e; border-radius: 8px; padding: 6px 10px; font-size: 12px; min-width: 130px; }
        .stat-card .sat-name { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; font-weight: 500; color: #fff; }
        .stat-card .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .stat-card .row { color: #888; }
        .stat-card .val { color: #fff; }
        #mapDiv { width: 100%; border-radius: 8px; overflow: hidden; border: 0.5px solid rgba(255,255,255,0.15); background: #0d1b2a; }
        #legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: #888; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        #status { font-size: 12px; color: #888; margin-bottom: 6px; }
        .ctrl-group { display: flex; align-items: center; gap: 6px; }
        .ctrl-sep { width: 1px; height: 20px; background: #333; margin: 0 4px; }
    </style>
</head>
<body>

<div id="controls">
    <label>Time</label>
    <input type="range" id="tSlider" min="0" max="9" value="0" step="1" style="flex:2;" />
    <span id="tLabel">00:00:00</span>
    <div class="ctrl-sep"></div>
    <button id="playBtn">Play</button>
    <div class="ctrl-group">
        <label>Speed</label>
        <input type="range" id="speedSlider" min="-10" max="10" value="0" step="1" style="width:100px;flex:none;" />
        <span id="speedLabel">1x</span>
    </div>
    <div class="ctrl-sep"></div>
    <button id="uploadBtn">Load CSV</button>
    <button id="uploadGSBtn">Load GS CSV</button>
    <button id="uploadEOBtn">Load EO CSV</button>
    <input type="file" id="csvFile" accept=".csv" style="display:none;" />
    <input type="file" id="gsFile" accept=".csv" style="display:none;" />
    <input type="file" id="eoFile" accept=".csv" style="display:none;" />
</div>

<div id="status">Waiting for data...</div>
<div id="statsRow"></div>
<div id="mapDiv"></div>
<div id="legend"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
    const COLORS = [
        '#4fc3f7','#81c784','#ffb74d','#f48fb1','#ce93d8','#80cbc4','#fff176','#ff8a65',
        '#e57373','#64b5f6','#aed581','#ffd54f','#4db6ac','#ba68c8','#ff8a65','#90a4ae',
        '#f06292','#4dd0e1','#dce775','#ffcc02','#26c6da','#ab47bc','#ef5350','#42a5f5',
        '#9ccc65','#ffa726','#26a69a','#7e57c2','#ec407a','#29b6f6','#d4e157','#ff7043',
        '#00bcd4','#8d6e63','#78909c','#66bb6a','#ffc107','#5c6bc0','#26c6da','#d81b60',
        '#00897b','#558b2f','#f57f17','#6a1b9a','#0277bd','#2e7d32','#e65100','#37474f',
        '#ad1457','#00695c'
    ];
    const EARTH_R = 6371000;

    function sliderToSpeed(v) { return Math.pow(10, v / 10); }

    function formatSecondsAsTime(secs, format) {
        var hr  = Math.floor(secs / 3600);
        var min = Math.floor((secs - (hr * 3600)) / 60);
        var sec = Math.floor(secs - (hr * 3600) - (min * 60));
        if (hr  < 10) { hr  = "0" + hr;  }
        if (min < 10) { min = "0" + min; }
        if (sec < 10) { sec = "0" + sec; }
        if (format != null) {
            var ft = format.replace('hh', hr);
            ft = ft.replace('h', hr*1+"");
            ft = ft.replace('mm', min);
            ft = ft.replace('m', min*1+"");
            ft = ft.replace('ss', sec);
            ft = ft.replace('s', sec*1+"");
            return ft;
        }
        return hr + ':' + min + ':' + sec;
    }

    let sats = {}, times = [], idx = 0, playing = false, timer = null;
    let groundStations = [];
    let EOzones = [];
    let svg, projection, pathGen, W, H;
    let dotLayer, trackLayer, gsLayer, eoLayer;
    let speedMultiplier = 1.0;
    window.mapInitialized = false;

    function xyz2ll(x, y, z) {
        const r = Math.sqrt(x*x + y*y + z*z);
        return [Math.atan2(y, x) * 180 / Math.PI, Math.asin(z / r) * 180 / Math.PI];
    }

    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const h = lines[0].split(',').map(s => s.trim());
        const iN=h.indexOf('name_sat'), iX=h.indexOf('x'), iY=h.indexOf('y'),
            iZ=h.indexOf('z'), iT=h.indexOf('t'), iF=h.indexOf('firing');
        const out = {}, ts = new Set();
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const name = c[iN]?.trim(), x = parseFloat(c[iX]), y = parseFloat(c[iY]),
                z = parseFloat(c[iZ]), t = parseFloat(c[iT]), firing = parseInt(c[iF]) || 0;
            if (!name || isNaN(x) || isNaN(t)) continue;
            if (!out[name]) out[name] = [];
            out[name].push({x, y, z, t, firing});
            ts.add(t);
        }
        return { sats: out, times: Array.from(ts).sort((a,b) => a - b) };
    }

    function parseGSCSV(text) {
        const lines = text.trim().split('\n');
        const h = lines[0].split(',').map(s => s.trim());
        const iN=h.indexOf('name'), iLat=h.indexOf('lat'), iLon=h.indexOf('long'),
            iAlt=h.indexOf('alt'), iA=h.indexOf('activated');
        const out = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const name = c[iN]?.trim();
            const lat  = parseFloat(c[iLat]);
            const lon  = parseFloat(c[iLon]);
            const activated = parseInt(c[iA]) === 1;
            if (!name || isNaN(lat) || isNaN(lon)) continue;
            out.push({ name, lat, lon, activated });
        }
        return out;
    }

    // Parse EO area CSV: name,lat1,long1,alt1,lat2,long2,alt2,lat3,long3,alt3,lat4,long4,alt4
    function parseEOCSV(text) {
        const lines = text.trim().split('\n');
        const out = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const c = lines[i].split(',');
            const name = c[0]?.trim();
            const points = [];
            // Read groups of 3: lat, lon, alt
            for (let j = 1; j + 2 <= c.length; j += 3) {
                const lat = parseFloat(c[j]);
                const lon = parseFloat(c[j+1]);
                if (!isNaN(lat) && !isNaN(lon)) {
                    points.push([lon, lat]); // D3 uses [lon, lat]
                }
            }
            if (name && points.length >= 3) {
                out.push({ name, points });
            }
        }
        return out;
    }

    function drawGroundStations() {
        gsLayer.selectAll('*').remove();
        groundStations.forEach(gs => {
            const pos = projection([gs.lon, gs.lat]);
            if (!pos) return;
            const col = gs.activated ? '#4caf50' : '#f44336';
            const size = 7;
            const diamond = `M${pos[0]},${pos[1]-size} L${pos[0]+size},${pos[1]} L${pos[0]},${pos[1]+size} L${pos[0]-size},${pos[1]} Z`;
            gsLayer.append('path')
                .attr('d', diamond)
                .attr('fill', col)
                .attr('stroke', '#fff')
                .attr('stroke-width', 0.8)
                .attr('opacity', 0.9);
            gsLayer.append('text')
                .attr('x', pos[0] + 10).attr('y', pos[1] + 4)
                .attr('fill', col).attr('font-size', '10px').attr('font-family', 'monospace')
                .text(gs.name);
        });
    }

    function loadEOAreas() {

        eoLayer.selectAll('*').remove();

        EOzones.forEach(area => {
            // Close the polygon by repeating the first point
            const closed = [...area.points, area.points[0]];

            // Project all points
            const projected = area.points.map(p => projection(p)).filter(p => p !== null);
            if (projected.length < 3) return;

            const closedProjected = [...projected, projected[0]];

            // Filled polygon — light blue semi-transparent
            const polyPath = 'M' + projected.map(p => p[0]+','+p[1]).join('L') + 'Z';
            eoLayer.append('path')
                .attr('d', polyPath)
                .attr('fill', '#29b6f6')
                .attr('fill-opacity', 0.15)
                .attr('stroke', '#29b6f6')
                .attr('stroke-width', 1.2)
                .attr('stroke-opacity', 0.7);

            // Area name label at centroid
            const cx = projected.reduce((s, p) => s + p[0], 0) / projected.length;
            const cy = projected.reduce((s, p) => s + p[1], 0) / projected.length;
            eoLayer.append('text')
                .attr('x', cx).attr('y', cy)
                .attr('fill', '#29b6f6')
                .attr('font-size', '10px')
                .attr('font-family', 'monospace')
                .attr('text-anchor', 'middle')
                .text(area.name);
        });

        buildLegend(EOzones.length > 0);
    }

    function applyGSData(stations) {
        groundStations = stations;
        drawGroundStations();
        buildLegend(false);
    }
    function applyEOData(zones) {
        EOzones = zones;
        loadEOAreas();
    }

    function loadGSFromText(text) {
        applyGSData(parseGSCSV(text));
    }
    function loadEOFromText(text) {
        applyEOData(parseEOCSV(text));
    }

    function getBest(pts, t) {
        let best = pts[0], bd = Infinity;
        pts.forEach(p => { const d = Math.abs(p.t - t); if (d < bd) { bd = d; best = p; } });
        return best;
    }

    function updateDots() {
        if (!times.length) return;
        const t = times[idx];
        document.getElementById('tLabel').textContent = formatSecondsAsTime(t);
        document.getElementById('tSlider').value = idx;
        dotLayer.selectAll('*').remove();

        Object.keys(sats).forEach((name, si) => {
            const col = COLORS[si % COLORS.length];
            const best = getBest(sats[name], t);
            const ll = xyz2ll(best.x, best.y, best.z);
            const pos = projection(ll);
            if (!pos) return;

            if (best.firing) {
                dotLayer.append('circle')
                    .attr('cx', pos[0]).attr('cy', pos[1]).attr('r', 11)
                    .attr('fill', 'none').attr('stroke', '#ffb74d').attr('stroke-width', 2);
            }
            dotLayer.append('circle')
                .attr('cx', pos[0]).attr('cy', pos[1]).attr('r', 6)
                .attr('fill', col).attr('stroke', '#fff').attr('stroke-width', 0.5);
            dotLayer.append('text')
                .attr('x', pos[0] + 9).attr('y', pos[1] + 4)
                .attr('fill', '#ffffff').attr('font-size', '11px').attr('font-family', 'monospace')
                .text(name);
            const alt = (Math.sqrt(best.x**2 + best.y**2 + best.z**2) - EARTH_R) / 1000;
            dotLayer.append('text')
                .attr('x', pos[0] + 9).attr('y', pos[1] + 15)
                .attr('fill', 'rgba(255,255,255,0.5)').attr('font-size', '10px').attr('font-family', 'monospace')
                .text(Math.round(alt) + ' km');
        });
        updateStats(t);
    }

    function drawTracks() {
        trackLayer.selectAll('*').remove();
        Object.keys(sats).forEach((name, si) => {
            const col = COLORS[si % COLORS.length];
            const pts = sats[name];
            const chunks = [];
            let chunk = [pts[0]];
            for (let i = 1; i < pts.length; i++) {
                const prev = xyz2ll(pts[i-1].x, pts[i-1].y, pts[i-1].z);
                const curr = xyz2ll(pts[i].x, pts[i].y, pts[i].z);
                if (Math.abs(curr[0] - prev[0]) > 180) { chunks.push(chunk); chunk = []; }
                chunk.push(pts[i]);
            }
            chunks.push(chunk);
            const lineGen = d3.line()
                .x(d => { const p = projection(xyz2ll(d.x, d.y, d.z)); return p ? p[0] : null; })
                .y(d => { const p = projection(xyz2ll(d.x, d.y, d.z)); return p ? p[1] : null; })
                .defined(d => projection(xyz2ll(d.x, d.y, d.z)) !== null);
            chunks.forEach(ch => {
                trackLayer.append('path').datum(ch)
                    .attr('d', lineGen)
                    .attr('fill', 'none')
                    .attr('stroke', col)
                    .attr('stroke-width', 1.2)
                    .attr('opacity', 0.5);
            });
        });
    }

    function buildLegend(hasEO) {
        const leg = document.getElementById('legend');
        leg.innerHTML = '';
        Object.keys(sats).forEach((name, si) => {
            const col = COLORS[si % COLORS.length];
            leg.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:${col};"></span>${name}</span>`;
        });
        if (groundStations.length > 0) {
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:10px;height:10px;background:#4caf50;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);"></span>GS active</span>`;
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:10px;height:10px;background:#f44336;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);"></span>GS inactive</span>`;
        }
        if (hasEO) {
            leg.innerHTML += `<span class="legend-item"><span style="display:inline-block;width:10px;height:10px;background:#1a2a3a;opacity:0.5;border:1px solid #15b1f9;"></span>EO observation zone</span>`;
        }
    }

    function updateStats(t) {
        const row = document.getElementById('statsRow');
        row.innerHTML = '';
        Object.keys(sats).forEach((name, si) => {
            const col = COLORS[si % COLORS.length];
            const best = getBest(sats[name], t);
            const ll = xyz2ll(best.x, best.y, best.z);
            const alt = (Math.sqrt(best.x**2 + best.y**2 + best.z**2) - EARTH_R) / 1000;
            row.innerHTML += `
            <div class="stat-card">
                <div class="sat-name"><span class="dot" style="background:${col};"></span>${name}</div>
                <div class="row">Lat <span class="val">${ll[1].toFixed(2)}°</span> &nbsp;Lon <span class="val">${ll[0].toFixed(2)}°</span></div>
                <div class="row">Alt <span class="val">${Math.round(alt)} km</span></div>
            </div>`;
        });
    }

    function applyData(parsed) {
        sats = parsed.sats;
        times = parsed.times;
        idx = 0;
        const sl = document.getElementById('tSlider');
        sl.min = 0; sl.max = times.length - 1; sl.value = 0;
        document.getElementById('status').textContent =
            Object.keys(sats).length + ' satellite(s), ' + times.length + ' time steps loaded.';
        buildLegend(false);
        drawTracks();
        updateDots();
    }

    function restartTimer() {
        if (!playing) return;
        clearInterval(timer);
        const interval = Math.max(16, Math.round(120 / speedMultiplier));
        const steps = speedMultiplier >= 1 ? Math.round(speedMultiplier) : 1;
        timer = setInterval(() => {
            idx = (idx + steps) % times.length;
            updateDots();
        }, interval);
    }

    function initMap() {
        const container = document.getElementById('mapDiv');
        W = container.clientWidth ;
        H = Math.round(W * 0.45);

        svg = d3.select('#mapDiv').append('svg').attr('width', W).attr('height', H);
        projection = d3.geoEquirectangular().scale(W / 6.28).translate([W/2, H/2]);
        pathGen = d3.geoPath().projection(projection);

        svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#0d1b2a');

        const graticule = d3.geoGraticule()();
        svg.append('g').append('path').datum(graticule)
            .attr('d', pathGen)
            .attr('fill', 'none').attr('stroke', 'rgba(255,255,255,0.08)').attr('stroke-width', 0.5);

        const landLayer = svg.append('g');
        eoLayer  = svg.append('g');  // EO zones — above land, below everything else
        trackLayer = svg.append('g');
        gsLayer    = svg.append('g');
        dotLayer   = svg.append('g');

        d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
            landLayer.selectAll('path')
                .data(topojson.feature(world, world.objects.countries).features)
                .join('path')
                .attr('d', pathGen)
                .attr('fill', '#1a3a5c')
                .attr('stroke', 'rgba(255,255,255,0.15)')
                .attr('stroke-width', 0.4);
            window.mapInitialized = true;
        }).catch(() => {
            window.mapInitialized = true;
        });
    }
    function resetmap() {
        svg = d3.select('#mapDiv').selectAll('*').remove();
        initMap();
    }

    document.getElementById('tSlider').addEventListener('input', e => {
        idx = parseInt(e.target.value); updateDots();
    });
    document.getElementById('speedSlider').addEventListener('input', e => {
        const v = parseInt(e.target.value);
        speedMultiplier = sliderToSpeed(v);
        const label = speedMultiplier < 1 ? speedMultiplier.toFixed(1)+'x' : Math.round(speedMultiplier)+'x';
        document.getElementById('speedLabel').textContent = label;
        restartTimer();
    });
    document.getElementById('playBtn').addEventListener('click', () => {
        playing = !playing;
        document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
        if (playing) { restartTimer(); } else { clearInterval(timer); }
    });
    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('csvFile').click());
    document.getElementById('csvFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { applyData(parseCSV(ev.target.result)); };
        r.readAsText(f);
    });
    document.getElementById('uploadGSBtn').addEventListener('click', () => document.getElementById('gsFile').click());
    document.getElementById('gsFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { applyGSData(parseGSCSV(ev.target.result)); };
        r.readAsText(f);
    });
    document.getElementById('uploadEOBtn').addEventListener('click', () => document.getElementById('eoFile').click());
    document.getElementById('eoFile').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => { loadEOAreas(ev.target.result); };
        r.readAsText(f);
    });
    window.addEventListener('resize', () => {
        // Wait until map is ready (async world load)
        const wait = setInterval(() => {
            if (!window.mapInitialized) return;
            clearInterval(wait);
            resetmap();
            drawTracks();
            loadEOAreas();
            drawGroundStations();
            updateDots();
            // EO zones need to be redrawn too if loaded
            // (they depend on projection)
            if (eoLayer && eoLayer.selectAll('*').size() === 0) {
                // you may want to store EO data globally instead
            }
        }, 50);
    });

    initMap();
</script>
</body>
</html>
